# AI Studio — M0 infra spine (Layer 0). Local-first; runs on the host Mac.
# Bring up with `./bootstrap` (or `make up`), then `make health`.
# Secrets/config come from .env (see .env.example + scripts/onboarding.sh).
# No Kubernetes in phase 1 (ADR-0004); supervisor + scheduler are a later milestone.

name: ai-studio

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Host-restricted remote access (ADR-0017). The wrapper renders pg_hba.conf
    # from the PG_ALLOWED_HOSTS allowlist at start, then hands off to the stock
    # entrypoint pointed at it (scram-sha-256, never trust / 0.0.0.0/0).
    entrypoint: ["/usr/local/bin/pg-entrypoint-wrapper.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aistudio}
      POSTGRES_DB: ${POSTGRES_DB:-aistudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/onboarding.sh to set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---auth-host=scram-sha-256}
      # Space/comma-separated CIDR allowlist of authorized LAN hosts (scram-sha-256).
      # EMPTY (default) = local/internal only, no LAN exposure. NEVER 0.0.0.0/0.
      PG_ALLOWED_HOSTS: ${PG_ALLOWED_HOSTS:-}
      PG_LISTEN_ADDRESSES: ${PG_LISTEN_ADDRESSES:-*}
    ports:
      # Bind the published port to PG_BIND_IP (default 127.0.0.1 — local-first, NOT
      # the internet). For LAN access set PG_BIND_IP to the host's LAN IP and add
      # the client to PG_ALLOWED_HOSTS + the firewall. See docs/db-operations.md.
      - "${PG_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Host-restricted remote access config (read-only). ADR-0017.
      - ./infra/postgres/pg_hba.conf.template:/etc/postgresql/pg_hba.conf.template:ro
      - ./infra/postgres/render-pg-hba.sh:/usr/local/bin/render-pg-hba.sh:ro
      - ./infra/postgres/docker-entrypoint-wrapper.sh:/usr/local/bin/pg-entrypoint-wrapper.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aistudio} -d ${POSTGRES_DB:-aistudio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # No container healthcheck: the qdrant image is distroless (no shell/curl),
    # so scripts/healthcheck.sh probes /healthz from the host instead.

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aistudio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run scripts/onboarding.sh to set MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    # No container healthcheck: the server image has no preconfigured `mc` alias
    # and may lack curl; scripts/healthcheck.sh probes /minio/health/live from the host.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "${OTEL_HTTP_PORT:-4318}:4318"   # OTLP HTTP
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  # WhatsApp Spokesman — stakeholder channel (ADR-0006). Opt-in only: it starts
  # solely with `docker compose --profile spokesman up`, so the M0 spine is
  # unaffected by a plain `docker compose up`. Config/secrets come from .env.
  spokesman:
    profiles: ["spokesman"]
    build:
      context: .
      dockerfile: spokesman/Dockerfile
    restart: unless-stopped
    environment:
      SPOKESMAN_PORT: ${SPOKESMAN_PORT:-8080}
      SPOKESMAN_DRY_RUN: ${SPOKESMAN_DRY_RUN:-0}
      SPOKESMAN_CHANNEL: ${SPOKESMAN_CHANNEL:-whatsapp}
      SPOKESMAN_API_TOKEN: ${SPOKESMAN_API_TOKEN:-}
      GRAPH_API_BASE: ${GRAPH_API_BASE:-https://graph.facebook.com}
      GRAPH_API_VERSION: ${GRAPH_API_VERSION:-v21.0}
      AI_STUDIO_STATE_DIR: /app/state
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      STAKEHOLDER_WHATSAPP_NUMBER: ${STAKEHOLDER_WHATSAPP_NUMBER:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_TO_NUMBER: ${TWILIO_TO_NUMBER:-}
      # Model-provider keys — the Spokesman is model-first (ADR-0026): it calls
      # `converse` (routed to the mid tier: claude-sonnet-5 → gemini-3.5-flash →
      # deepseek). Without these IN THE CONTAINER, AnthropicAdapter.available() is
      # False and select_provider() silently falls back to the dry-run REGEX stub
      # — so the chat "agent" can't actually converse even with a key in .env.
      # (openweight/deepseek needs no key.) MODELS_DRY_RUN forces the stub when set.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODELS_DRY_RUN: ${MODELS_DRY_RUN:-}
      # Runtime bridge reads the live event log / approvals (compose DNS name).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-aistudio}
      POSTGRES_DB: ${POSTGRES_DB:-aistudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/onboarding.sh to set POSTGRES_PASSWORD}
    ports:
      - "${SPOKESMAN_PORT:-8080}:${SPOKESMAN_PORT:-8080}"
    volumes:
      # Inbound messages / status summaries integrate with the git state tree
      # (ADR-0007). The runtime inbound log is git-ignored.
      - ./state:/app/state
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,os; urllib.request.urlopen('http://localhost:'+os.environ.get('SPOKESMAN_PORT','8080')+'/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # Task gateway — the ONLY way a non-LAN remote session touches the queue
  # (ADR-0028). It exposes the lifecycle VERBS (list/enqueue/claim/heartbeat/
  # complete) through runtime.tasks behind a scoped bearer token; Postgres itself
  # stays bound to loopback (ADR-0017). Opt-in: starts only with
  # `docker compose --profile gateway up`, so the M0 spine is unaffected.
  task-gateway:
    profiles: ["gateway"]
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    environment:
      TASK_GATEWAY_PORT: ${TASK_GATEWAY_PORT:-8081}
      # SECRET-bearing but hash-only: identity:scopes:sha256hex[:workstreams]
      # entries. EMPTY (default) = fail closed — every task endpoint answers 503.
      TASK_GATEWAY_TOKENS: ${TASK_GATEWAY_TOKENS:-}
      TASK_GATEWAY_RATE_PER_MIN: ${TASK_GATEWAY_RATE_PER_MIN:-120}
      TASK_GATEWAY_BURST: ${TASK_GATEWAY_BURST:-20}
      TASK_GATEWAY_MAX_BODY_BYTES: ${TASK_GATEWAY_MAX_BODY_BYTES:-65536}
      TASK_GATEWAY_MAX_PAYLOAD_BYTES: ${TASK_GATEWAY_MAX_PAYLOAD_BYTES:-16384}
      TASK_GATEWAY_MAX_PRIORITY: ${TASK_GATEWAY_MAX_PRIORITY:-10}
      TASK_GATEWAY_MAX_BUDGET_TOKENS: ${TASK_GATEWAY_MAX_BUDGET_TOKENS:-200000}
      TASK_GATEWAY_MAX_LIMIT: ${TASK_GATEWAY_MAX_LIMIT:-100}
      # The DB credential stays HERE (host side) and never reaches a remote.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-aistudio}
      POSTGRES_DB: ${POSTGRES_DB:-aistudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/onboarding.sh to set POSTGRES_PASSWORD}
    ports:
      # Loopback by default — reachability comes ONLY from an authenticated
      # tunnel (see docs/remote-task-access.md). NEVER bind a public interface.
      - "${TASK_GATEWAY_BIND_IP:-127.0.0.1}:${TASK_GATEWAY_PORT:-8081}:${TASK_GATEWAY_PORT:-8081}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,os; urllib.request.urlopen('http://localhost:'+os.environ.get('TASK_GATEWAY_PORT','8081')+'/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

# Fixed internal subnet so Postgres' pg_hba can trust the compose network by CIDR
# (172.28.0.0/16) while keeping remote LAN access a strict allowlist (ADR-0017).
# Host tools reach Postgres through the published port, SNAT'd to this subnet's
# gateway — hence the matching `host ... 172.28.0.0/16` rule in pg_hba.conf.template.
networks:
  default:
    ipam:
      config:
        - subnet: ${PG_INTERNAL_SUBNET:-172.28.0.0/16}

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  prometheus_data:
  grafana_data:
