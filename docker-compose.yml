# AI Studio — M0 infra spine (Layer 0). Local-first; runs on the host Mac.
# Bring up with `./bootstrap` (or `make up`), then `make health`.
# Secrets/config come from .env (see .env.example + scripts/onboarding.sh).
# No Kubernetes in phase 1 (ADR-0004); supervisor + scheduler are a later milestone.

name: ai-studio

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aistudio}
      POSTGRES_DB: ${POSTGRES_DB:-aistudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/onboarding.sh to set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aistudio} -d ${POSTGRES_DB:-aistudio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # No container healthcheck: the qdrant image is distroless (no shell/curl),
    # so scripts/healthcheck.sh probes /healthz from the host instead.

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aistudio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run scripts/onboarding.sh to set MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    # No container healthcheck: the server image has no preconfigured `mc` alias
    # and may lack curl; scripts/healthcheck.sh probes /minio/health/live from the host.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "${OTEL_HTTP_PORT:-4318}:4318"   # OTLP HTTP
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  # WhatsApp Spokesman — stakeholder channel (ADR-0006). Opt-in only: it starts
  # solely with `docker compose --profile spokesman up`, so the M0 spine is
  # unaffected by a plain `docker compose up`. Config/secrets come from .env.
  spokesman:
    profiles: ["spokesman"]
    build:
      context: .
      dockerfile: spokesman/Dockerfile
    restart: unless-stopped
    environment:
      SPOKESMAN_PORT: ${SPOKESMAN_PORT:-8080}
      SPOKESMAN_DRY_RUN: ${SPOKESMAN_DRY_RUN:-0}
      GRAPH_API_BASE: ${GRAPH_API_BASE:-https://graph.facebook.com}
      GRAPH_API_VERSION: ${GRAPH_API_VERSION:-v21.0}
      AI_STUDIO_STATE_DIR: /app/state
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      STAKEHOLDER_WHATSAPP_NUMBER: ${STAKEHOLDER_WHATSAPP_NUMBER:-}
    ports:
      - "${SPOKESMAN_PORT:-8080}:${SPOKESMAN_PORT:-8080}"
    volumes:
      # Inbound messages / status summaries integrate with the git state tree
      # (ADR-0007). The runtime inbound log is git-ignored.
      - ./state:/app/state
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,os; urllib.request.urlopen('http://localhost:'+os.environ.get('SPOKESMAN_PORT','8080')+'/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  prometheus_data:
  grafana_data:
