# AI Studio — PostgreSQL server settings (reference / optional mount).
# =============================================================================
# The docker-compose service sets these via `-c` flags in
# docker-entrypoint-wrapper.sh, so this file is a documented REFERENCE you can
# instead mount and select with `-c config_file=/etc/postgresql/postgresql.conf`.
# See docs/db-operations.md + ADR-0017.

# --- Networking --------------------------------------------------------------
# Which interfaces the server accepts connections on INSIDE the container. '*'
# accepts on all container interfaces; this does NOT expose Postgres to the
# internet by itself — access is gated by pg_hba.conf (the host allowlist), the
# host port binding (PG_BIND_IP, default 127.0.0.1), and the firewall.
listen_addresses = '*'
port = 5432

# --- Authentication ----------------------------------------------------------
# Force strong password hashing so the allowlist rules use scram-sha-256, never
# md5 or trust.
password_encryption = scram-sha-256

# --- Optional TLS (recommended for real remote LAN access) -------------------
# Terminate TLS at Postgres so LAN traffic is encrypted end to end. Provide the
# cert/key (mounted read-only, key mode 0600, owned by the postgres user), then:
# ssl = on
# ssl_cert_file = '/etc/postgresql/tls/server.crt'
# ssl_key_file  = '/etc/postgresql/tls/server.key'
# ...and switch the allowlist rules from `host` to `hostssl` in pg_hba to REQUIRE
# TLS for remote hosts. See docs/db-operations.md.
