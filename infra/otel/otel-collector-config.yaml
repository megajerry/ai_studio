# OpenTelemetry Collector — M0 minimal config.
# Receives OTLP (traces/metrics/logs) from the runtime; exposes metrics for
# Prometheus to scrape. Expand as the runtime emits real telemetry.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Expose received metrics on :8889 for Prometheus to scrape.
  prometheus:
    endpoint: 0.0.0.0:8889
  # Print to collector logs (handy while bootstrapping).
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
