# AI Studio — policy rules (EXAMPLE / documented default).
#
# Rules are DATA, not code (architecture §5). The policy engine
# (runtime/policy.py) reads this file to answer, for each tool call:
#   Can Read? Can Write? Need Approval? Need Budget?
#
# Resolution order (runtime.policy.resolve_policy_path):
#   1. $AI_STUDIO_POLICY_FILE (explicit path)
#   2. runtime/policy.yaml      (real, git-ignored local policy)
#   3. runtime/policy.example.yaml  (this file — committed fallback)
#
# Copy this to runtime/policy.yaml and edit for a real deployment. This file
# contains NO secrets or personal info and is safe to commit (ADR-0011).

# --- roles → granted capabilities (least privilege) -------------------------
# A role may only use capabilities it is granted here; anything else is DENIED
# by the engine before tier/budget are even considered. Grant the minimum.
#
# Capability vocabulary (runtime/capabilities.py):
#   fs.read  fs.write  fs.delete  shell.exec  code.run  git.write
#   net.fetch  secret.use  spend.money  deploy
roles:
  # --- Studio operating loop roles (M3c) ------------------------------------
  # The PM plans; it never does the work itself. It reads state and calls a
  # planning model, then enqueues a work task (task-queue coordination, not a
  # direct call). Least privilege: read only.
  pm:
    - fs.read

  # The Executor DOES the work: it writes a scratch artifact (fs.write, 🟡) and
  # calls an execution model. It cannot delete (fs.delete 🔴) or shell
  # (shell.exec 🔴) — those are denied by least privilege, proving the gate.
  executor:
    - fs.read
    - fs.write

  # The Verifier is the INDEPENDENT verify→commit gate: it only reads back the
  # artifact to check the success criterion. Read-only by design so it can never
  # "fix" the work it is judging.
  verifier:
    - fs.read

  # Reads and searches only — the architecture §5 "Research role" example.
  researcher:
    - fs.read
    - net.fetch

  # The Sourcing agent (ADR-0005) researches models/pricing via the search gateway
  # (net.fetch 🟢) and writes a REVIEWABLE candidate registry update via the
  # filesystem tool (fs.write 🟡) — never the live registry. A new provider /
  # budget-increasing change still raises a 🛑 approval; an in-band swap auto-adopts.
  sourcing:
    - fs.read
    - fs.write
    - net.fetch

  # Writes code + commits; cannot delete or deploy. Dispatches a coding worker
  # (opencode) via the `coding` tool — code.run is 🔴, so the dispatch still
  # requires human approval and only ever runs inside the sandbox (architecture §14).
  builder:
    - fs.read
    - fs.write
    - git.write
    - code.run

  # Reviewer inspects only.
  reviewer:
    - fs.read

  # Deploy role — the architecture §5 example: git + deploy + shell, no more.
  # (deploy / shell.exec are 🔴, so calls still require human approval.)
  deployer:
    - fs.read
    - fs.write
    - git.write
    - deploy
    - shell.exec

  # Uses external paid/authenticated services (secret read from env by the tool,
  # never handed to the agent). spend.money is 🔴 → approval-gated.
  operator:
    - fs.read
    - net.fetch
    - secret.use
    - spend.money

# --- tier overrides (optional) ----------------------------------------------
# Override the built-in capability→tier map (runtime/capabilities.py) as data.
# Example (commented): treat network fetches as 🟡 (logged) instead of 🟢.
tier_overrides: {}
  # net.fetch: yellow
